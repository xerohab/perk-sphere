name: Launch readiness checks
on:
  push:
    branches: [main, launch-readiness-2026-10-10]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_BASE44_APP_ID: '6ac4c3e3ea28af5826e4b364'
      VITE_BASE44_APP_BASE_URL: 'https://perk-sphere-hub.base44.app'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:backend
      - run: npm run build
