<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Perk Sphere brings rewards, loyalty and participating online destinations together. Earn points, build Loyalty XP, unlock ranks and redeem rewards." />
    <link rel="manifest" href="/manifest.json" />
    <title>Perk Sphere — Your activity. Your loyalty. Your rewards.</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('perk-theme');
          var theme = stored || 'system';
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = theme === 'dark' || (theme === 'system' && systemDark) || (!theme && systemDark);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
